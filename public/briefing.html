<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>Pluto · Operation 2006</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#ffd60a;--bg:#050505;--muted:#a5a5a5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#f6f6f6;font-family:Manrope,system-ui,sans-serif}body{min-height:100svh;display:flex;justify-content:center}.shell{width:min(100%,540px);min-height:100svh;padding:24px 22px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{font-size:12px;letter-spacing:3px;color:#aaa;margin:8px 0 28px}.visual{height:min(48svh,390px);min-height:260px;display:grid;place-items:center;position:relative;overflow:hidden}.planet{width:min(65vw,300px);aspect-ratio:1;border:3px solid var(--y);border-radius:50%;background:radial-gradient(circle,#332b00 0%,#181500 74%);display:grid;place-items:center;position:relative;box-shadow:0 0 55px #ffd60a14}.symbol{font-size:clamp(95px,28vw,150px);line-height:1;color:var(--y);font-weight:800}.stamp{position:absolute;bottom:5%;left:50%;transform:translateX(-50%) rotate(-5deg);border:4px solid var(--y);border-radius:12px;padding:8px 25px;color:var(--y);font-size:clamp(20px,5vw,30px);font-weight:800;letter-spacing:5px;white-space:nowrap;background:#090900}.kicker{text-align:center;color:var(--y);font-size:12px;font-weight:800;letter-spacing:4px;margin:14px 0 18px;text-transform:uppercase}.headline{text-align:center;font-size:clamp(25px,7vw,35px);line-height:1.2;letter-spacing:-1px;margin:0 auto 18px;max-width:460px;font-weight:800}.copy{text-align:center;color:#c5c5c5;font-size:clamp(15px,4vw,18px);line-height:1.65;margin:0 auto;max-width:470px;min-height:94px}.foot{margin-top:auto;padding-top:26px}.progress{display:flex;gap:8px;justify-content:center;margin:0 0 20px}.progress i{height:6px;flex:1;max-width:42px;border-radius:9px;background:#292929}.progress i.on{background:var(--y)}button{font:inherit;cursor:pointer}.next{width:100%;border:0;border-radius:18px;padding:19px 14px;background:var(--y);color:#080800;font-size:18px;font-weight:800;min-height:60px}.skip{width:100%;margin-top:12px;border:1px solid #292929;border-radius:18px;background:transparent;color:#aaa;font-weight:700;padding:17px;min-height:56px}.dots{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#fff9 1px,transparent 1.5px);background-size:83px 91px;opacity:.5}.hidden{display:none}@media(min-height:850px){.visual{height:43svh}}
</style></head><body><main class="shell"><div class="top">PLUTO · OPERATION 2006</div><section class="visual" aria-hidden="true"><div class="dots"></div><div class="planet"><div id="symbol" class="symbol">◉</div></div><div class="stamp" id="stamp">CLASSIFIED</div></section><div class="kicker" id="kicker"></div><h1 class="headline" id="headline"></h1><p class="copy" id="copy"></p><footer class="foot"><div class="progress" id="progress" aria-label="Briefing progress"></div><button class="next" id="next">Next</button><button class="skip" id="skip">Skip briefing</button></footer></main>
<script>
(()=>{const slides=[
{stamp:'CLASSIFIED',kicker:'Chapter 1 · The vote',head:'424 astronomers. One gavel.',copy:'Prague, August 24, 2006. In a single afternoon, a planet that had stood for 76 years was erased from the list. Textbooks were rewritten overnight.',symbol:'◉'},
{stamp:'OFFICIAL',kicker:'Chapter 2 · The official story',head:'“It was about size.”',copy:'The rule they used was drafted in days and fit exactly one world. Nobody asked who needed it written, or why it had to pass that week.',symbol:'◉'},
{stamp:'SURVEY 2005',kicker:'Chapter 3 · The survey',head:'Someone had already looked underneath.',copy:'In 2005, a sealed survey found a dense crystal under Pluto’s nitrogen ice. It gave off energy and never ran down. The file had a single codename: PLU.',symbol:'◉'},
{stamp:'SEALED',kicker:'Chapter 4 · The loophole',head:'A planet draws attention. A dwarf draws none.',copy:'Planets attract flags, treaties and inspectors. A dwarf planet attracts nobody. The perfect place to dig in silence.',symbol:'◉'},
{stamp:'THE AGENCY',kicker:'Chapter 5 · The agency',head:'Twenty years of quiet mining.',copy:'A private consortium, known only as the Agency, has pulled PLU from the ice since 2006, keeping the supply tight and the world looking elsewhere.',symbol:'◉'},
{stamp:'HEART 2015',kicker:'Chapter 6 · The heart',head:'The ice over the main vein formed a heart.',copy:'In 2015, a probe photographed a heart-shaped plain 1,000 km wide. The world called it cute. The Agency called an emergency meeting.',symbol:'♥'},
{stamp:'LEAKED',kicker:'Chapter 7 · The leak',head:'Then a technician copied the file.',copy:'Technician K sent the entire dossier down the one channel the Agency doesn’t monitor, a quiet signal for miners. You found it.',symbol:'♥'},
{stamp:'DECLASSIFIED',kicker:'Chapter 8 · The mission',head:'You are the fleet.',copy:'Each rocket is a 24-hour classified run before the Agency detects it. Every op you finish raises your clearance and strips another redaction from the file.',symbol:'♥'}];
const KEY='pluto:operation2006:progress:v1',LAST=slides.length-1;let at=0;try{const n=Number(localStorage.getItem(KEY));if(Number.isInteger(n)&&n>=0&&n<=LAST)at=n}catch{}
const $=id=>document.getElementById(id),bar=$('progress');slides.forEach((_,i)=>{const d=document.createElement('i');d.setAttribute('aria-hidden','true');bar.appendChild(d)});
function save(){try{localStorage.setItem(KEY,String(at))}catch{}}
function draw(){const s=slides[at];$('stamp').textContent=s.stamp;$('kicker').textContent=s.kicker;$('headline').textContent=s.head;$('copy').textContent=s.copy;$('symbol').textContent=s.symbol;[...bar.children].forEach((d,i)=>d.classList.toggle('on',i<=at));$('next').textContent=at===LAST?'Accept the mission 🚀':'Next';$('skip').textContent=at===LAST?'Back to briefing':'Skip briefing';}
function auth(){save();const p=new URLSearchParams(location.search);location.href='auth.html'+(p.has('ref')?'?ref='+encodeURIComponent(p.get('ref')):'')}
$('next').addEventListener('click',()=>{if(at===LAST){try{localStorage.setItem('pluto:operation2006:complete:v1','1')}catch{}auth();return}at++;save();draw()});
$('skip').addEventListener('click',()=>{if(at===LAST){at=0;save();draw();return}auth()});
draw();
})();
</script></body></html>
